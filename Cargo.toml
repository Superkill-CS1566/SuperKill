[package]
name = "superkill"
version = "0.1.0"
edition = "2024"
default-run = "superkill"

[dependencies]
bevy = "0.19"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
